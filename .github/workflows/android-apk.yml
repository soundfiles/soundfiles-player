name: Build UlubMP3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ulubmp3-apk-final
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build optimized release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk UlubMP3-release-slim.apk

      - name: Show APK size
        run: ls -lh UlubMP3-release-slim.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UlubMP3-release-slim-apk
          path: UlubMP3-release-slim.apk
          if-no-files-found: error
          retention-days: 14
