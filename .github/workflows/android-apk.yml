name: Build UlubMP3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ulubmp3-apk-final
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UlubMP3-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UlubMP3-debug-apk
          path: UlubMP3-debug.apk
          if-no-files-found: error
          retention-days: 14
